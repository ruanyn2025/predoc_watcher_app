<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Predoc Watcher{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/">Predoc Watcher</a>
    <nav>
      <a href="/"         class="{{ 'on' if nav=='index' }}">新增</a>
      <a href="/history"  class="{{ 'on' if nav=='history' }}">历史列表</a>
      <a href="/starred"  class="{{ 'on' if nav=='starred' }}">收藏夹{% if stats.starred %} <b>{{ stats.starred }}</b>{% endif %}</a>
      <a href="/calendar" class="{{ 'on' if nav=='calendar' }}">日历</a>
    </nav>
    <div class="spacer"></div>
    <span class="counts">在招 {{ stats.open }} · 已下架 {{ stats.closed }}</span>
    <button class="btn ghost" onclick="refreshData(this)">刷新</button>
  </div>
</header>

<main class="wrap">
{% block body %}{% endblock %}
</main>

<div id="toast"></div>

<div id="starModal" class="modal" hidden>
  <div class="modal-box">
    <h3>加入收藏并设置提醒</h3>
    <p class="job-title" id="smTitle"></p>
    <div class="src-note" id="smDeadline"></div>
    <label class="field">
      <span>提醒日期</span>
      <input type="date" id="smDate">
    </label>
    <div class="quick" id="smQuick"></div>
    <label class="field">
      <span>备注（可选）</span>
      <input type="text" id="smNote" placeholder="比如：需要两封推荐信">
    </label>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeStar()">取消</button>
      <button class="btn primary" onclick="confirmStar()">确认收藏</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
